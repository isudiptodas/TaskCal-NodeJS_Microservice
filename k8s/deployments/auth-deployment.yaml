apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: <container-name>
          ports:
            - containerPort: 5000
          envFrom:
          - secretRef:
              name: taskcal-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
