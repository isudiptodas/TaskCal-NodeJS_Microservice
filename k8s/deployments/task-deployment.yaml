apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task
  template:
    metadata:
      labels:
        app: task
    spec:
      containers:
        - name: task-container
          image: <container-name>
          ports:
            - containerPort: 7000
          envFrom:
            - secretRef:
              name: taskcal-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
