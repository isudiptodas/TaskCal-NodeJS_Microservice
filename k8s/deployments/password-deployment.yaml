apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: password
  template:
    metadata:
      labels:
        app: password
    spec:
      containers:
        - name: password-container
          image: <container-name>
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
              name: taskcal-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
